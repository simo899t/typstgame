<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typstique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <!-- Typst WASM — used for both target display and live preview -->
  <script type="module"
    src="https://cdn.jsdelivr.net/npm/@myriaddreamin/typst-all-in-one.ts@0.6.0/dist/esm/index.js"
    id="typst-script">
  </script>

  <style>
    :root {
      --bg:      #0b0b14;
      --surface: #14142a;
      --surface2:#1c1c38;
      --border:  #2a2a50;
      --accent:  #818cf8;
      --accent2: #c084fc;
      --text:    #e2e2f0;
      --muted:   #5a5a80;
      --success: #34d399;
      --error:   #f87171;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image:
        linear-gradient(rgba(129,140,248,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(129,140,248,.04) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    .screen { width: 100%; max-width: 660px; }
    .screen[hidden] { display: none !important; }

    /* ── LOADING ── */
    #loading-screen {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent) 30%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -3px;
      line-height: 1;
    }

    .tagline {
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .16em;
      color: var(--muted);
    }

    .loading-dots {
      display: flex;
      gap: 6px;
      align-items: center;
      color: var(--muted);
      font-size: .78rem;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce .9s infinite;
      opacity: .4;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }

    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); opacity: .4; }
      40%          { transform: translateY(-5px); opacity: 1; }
    }

    /* ── GAME ── */
    #game-screen { display: flex; flex-direction: column; gap: 8px; }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .hud-logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
    }

    .hud-right { display: flex; gap: 20px; align-items: center; }

    .hud-stat { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
    .hud-label { font-size: .6rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
    .hud-value { font-size: 1.2rem; font-weight: 700; line-height: 1; }

    /* formula card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 110px;
      position: relative;
      overflow: hidden;
      transition: border-color .25s;
    }

    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(129,140,248,.07), rgba(192,132,252,.07));
      opacity: 0;
      transition: opacity .25s;
    }

    .card.correct { border-color: var(--success); }
    .card.correct::after { opacity: 1; }

    /* Typst SVG output */
    .card svg, .preview-card svg {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      filter: invert(1);
    }

    #target-inner { position: relative; z-index: 1; font-size: 1.1rem; }

    /* input */
    .input-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      transition: border-color .2s;
    }
    .input-row:focus-within { border-color: var(--accent); }
    .input-row.correct { border-color: var(--success); }

    .prompt { color: var(--accent2); font-size: 1.1rem; user-select: none; flex-shrink: 0; }

    #typst-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: .95rem;
      width: 100%;
      padding: 14px 0;
      caret-color: var(--accent);
    }
    #typst-input::placeholder { color: var(--muted); opacity: .4; }

    /* preview */
    .preview-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 24px;
      transition: border-color .25s;
    }
    .preview-card.correct { border-color: var(--success); }

    #preview-inner {
      font-size: .78rem;
      font-style: italic;
      color: var(--muted);
    }

    /* bottom row */
    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .progress-text { font-size: .72rem; color: var(--muted); }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 16px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: .78rem;
      cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    kbd {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: .7em;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── DONE SCREEN ── */
    #done-screen { text-align: center; }

    .done-score {
      font-family: 'Syne', sans-serif;
      font-size: clamp(4rem, 15vw, 6rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -4px;
      line-height: 1;
      margin: 8px 0 32px;
    }

    .done-label { font-size: .68rem; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }

    .btn {
      display: inline-block;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      padding: 13px 44px;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    .btn:hover { opacity: .9; transform: translateY(-1px); }

    /* ── FLASH ── */
    #flash {
      position: fixed; inset: 0; pointer-events: none;
      opacity: 0; background: rgba(52,211,153,.06); transition: opacity .08s;
    }
    #flash.on { opacity: 1; }
  </style>
</head>
<body>

<div id="flash"></div>

<!-- LOADING (shown while Typst WASM + problems.txt load) -->
<div class="screen" id="loading-screen">
  <div class="logo">Typstique</div>
  <div class="tagline">A Typst Math Typing Game</div>
  <div class="loading-dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <span id="loading-text" style="margin-left:6px">loading typst…</span>
  </div>
</div>

<!-- GAME -->
<div class="screen" id="game-screen" hidden>
  <div class="hud">
    <div class="hud-logo">Typstique</div>
    <div class="hud-right">
      <div class="hud-stat">
        <span class="hud-label">Problem</span>
        <span class="hud-value" id="hud-progress">1 / ?</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">Solved</span>
        <span class="hud-value" id="hud-solved">0</span>
      </div>
    </div>
  </div>

  <!-- Target: rendered by Typst WASM -->
  <div class="card" id="target-card">
    <div id="target-inner"></div>
  </div>

  <!-- User input -->
  <div class="input-row" id="input-row">
    <span class="prompt">$</span>
    <input type="text" id="typst-input"
      placeholder="type typst math…"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  </div>

  <!-- Live preview: also Typst WASM -->
  <div class="preview-card" id="preview-card">
    <div id="preview-inner">your output appears here</div>
  </div>

  <div class="bottom-row">
    <span class="progress-text" id="progress-text"></span>
    <button class="btn-ghost" onclick="skip()">Skip <kbd>Tab</kbd></button>
  </div>
</div>

<!-- DONE -->
<div class="screen" id="done-screen" hidden>
  <div class="done-label">Completed</div>
  <div class="done-score" id="done-score">0 / 0</div>
  <button class="btn" onclick="restart()">Play Again</button>
</div>

<script>
// ── STATE ─────────────────────────────────────────────────────────────────────
let problems  = [];   // array of Typst math strings from problems.txt
let index     = 0;    // current problem index
let solved    = 0;
let skipped   = 0;
let typstReady = false;

// ── TYPST WASM ────────────────────────────────────────────────────────────────
document.getElementById('typst-script').addEventListener('load', () => {
  typstReady = true;
  tryStart();
});

function makeTypstDoc(math) {
  return [
    '#set page(width: auto, height: auto, margin: (x: 10pt, y: 6pt), fill: none)',
    '#set text(size: 22pt)',
    `$ ${math} $`,
  ].join('\n');
}

async function renderTypst(math) {
  return await $typst.svg({ mainContent: makeTypstDoc(math) });
}

// ── LOAD PROBLEMS ─────────────────────────────────────────────────────────────
let problemsLoaded = false;

fetch('problems.txt')
  .then(r => r.text())
  .then(text => {
    problems = text
      .split('\n')
      .map(l => {
        l = l.trim();
        if (l.startsWith('$') && l.endsWith('$') && l.length > 1)
          l = l.slice(1, -1).trim();
        return l;
      })
      .filter(l => l && !l.startsWith('#'));
    problemsLoaded = true;
    tryStart();
  })
  .catch(() => {
    const el = document.getElementById('loading-text');
    el.textContent = 'could not load problems.txt — serve with: python3 -m http.server';
    el.style.color = 'var(--error)';
  });

// ── START WHEN BOTH READY ─────────────────────────────────────────────────────
function tryStart() {
  if (!typstReady || !problemsLoaded) return;
  index = 0; solved = 0; skipped = 0;
  show('game-screen');
  loadProblem();
}

// ── GAME FLOW ─────────────────────────────────────────────────────────────────
async function loadProblem() {
  if (index >= problems.length) { showDone(); return; }

  const math = problems[index];

  // Render target
  const targetEl = document.getElementById('target-inner');
  targetEl.textContent = '…';
  try {
    targetEl.innerHTML = await renderTypst(math);
  } catch(_) {
    targetEl.textContent = math;
  }

  // Reset UI
  document.getElementById('target-card').classList.remove('correct');
  document.getElementById('input-row').classList.remove('correct');
  document.getElementById('preview-card').classList.remove('correct');
  document.getElementById('preview-inner').textContent = 'your output appears here';
  document.getElementById('preview-inner').style.fontStyle = 'italic';

  const inp = document.getElementById('typst-input');
  inp.value = '';
  inp.focus();

  updateHUD();
}

function updateHUD() {
  document.getElementById('hud-progress').textContent = `${index + 1} / ${problems.length}`;
  document.getElementById('hud-solved').textContent   = solved;
  document.getElementById('progress-text').textContent =
    `${problems.length - index - 1} remaining · ${skipped} skipped`;
}

function skip() {
  skipped++;
  index++;
  loadProblem();
}

function onCorrect() {
  solved++;
  document.getElementById('target-card').classList.add('correct');
  document.getElementById('input-row').classList.add('correct');
  document.getElementById('preview-card').classList.add('correct');

  const fl = document.getElementById('flash');
  fl.classList.add('on');
  setTimeout(() => fl.classList.remove('on'), 120);

  setTimeout(() => { index++; loadProblem(); }, 500);
}

function showDone() {
  document.getElementById('done-score').textContent = `${solved} / ${problems.length}`;
  show('done-screen');
}

function restart() {
  index = 0; solved = 0; skipped = 0;
  show('game-screen');
  loadProblem();
}

function show(id) {
  ['loading-screen', 'game-screen', 'done-screen'].forEach(s => {
    document.getElementById(s)[s === id ? 'removeAttribute' : 'setAttribute']('hidden', '');
  });
}

// ── INPUT ─────────────────────────────────────────────────────────────────────
const norm = s => s.trim().replace(/\s+/g, ' ');

let previewTimer = null;

document.getElementById('typst-input').addEventListener('input', async e => {
  const val = e.target.value;

  // Check match
  if (norm(val) === norm(problems[index])) { onCorrect(); return; }

  // Live preview (debounced)
  clearTimeout(previewTimer);
  const inner = document.getElementById('preview-inner');

  if (!val.trim()) {
    inner.innerHTML = '';
    inner.textContent = 'your output appears here';
    inner.style.fontStyle = 'italic';
    return;
  }

  previewTimer = setTimeout(async () => {
    try {
      const svg = await renderTypst(val);
      inner.style.fontStyle = 'normal';
      inner.innerHTML = svg;
    } catch(_) {
      inner.style.fontStyle = 'italic';
      inner.textContent = 'parse error';
      inner.style.color = 'var(--error)';
    }
  }, 250);
});

document.getElementById('typst-input').addEventListener('keydown', e => {
  if (e.key === 'Tab') { e.preventDefault(); skip(); }
});
</script>
</body>
</html>
